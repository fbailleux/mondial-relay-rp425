[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mondial-relay-rp425"
version = "1.0.0"
description = "Imprime le bon d'envoi Mondial Relay sur une étiqueteuse Rongta RP425 (ZPL 203 dpi), depuis macOS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fbailleux" }]
keywords = ["zpl", "label", "mondial-relay", "rp425", "pdf", "macos"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Topic :: Printing",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["imprimer_etiquette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9"]